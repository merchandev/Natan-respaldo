name: natan-respaldo
services:
  app:
    build: .
    restart: unless-stopped
    # Hostinger puede compilar en /tmp y ejecutar en /docker: sin bind mounts
    # ni archivos .env obligatorios en el directorio de ejecución.
    environment:
      PORT: '3000'
      SUPABASE_URL: ${SUPABASE_URL:-https://lhqskltrsqhwcdvnfljy.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      D3XD_API_TOKEN: ${D3XD_API_TOKEN:-}
      BNC_BASE_URL: ${BNC_BASE_URL:-}
      BNC_CLIENT_GUID: ${BNC_CLIENT_GUID:-}
      BNC_MASTER_KEY: ${BNC_MASTER_KEY:-}
      BNC_WEBHOOK_API_KEY: ${BNC_WEBHOOK_API_KEY:-}
      BNC_INTERNAL_TOKEN: ${BNC_INTERNAL_TOKEN:-}
      FRONTEND_SUPABASE_URL: ${FRONTEND_SUPABASE_URL:-}
      FRONTEND_SUPABASE_ANON_KEY: ${FRONTEND_SUPABASE_ANON_KEY:-}
    ports:
      - '${NATAN_BIND_ADDRESS:-0.0.0.0}:${NATAN_HTTP_PORT:-18091}:3000'
    labels:
      traefik.enable: 'false'
    init: true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 100
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
