name: Validar paquete VPS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --omit=dev --ignore-scripts
        working-directory: codigo-fuente
      - run: node --test deploy/server.test.cjs
      - run: node deploy/verify.mjs
      - run: node --test deploy/compose.test.mjs
      - run: python3 -m unittest discover -s deploy -p 'test_https.py'
      - run: docker compose -p natan-ci up -d --build --wait --wait-timeout 90
        env:
          NATAN_BIND_ADDRESS: 127.0.0.1
          NATAN_HTTP_PORT: '18091'
      - name: Comprobar tienda, panel y salud
        run: |
          curl --fail --silent http://127.0.0.1:18091/healthz
          curl --fail --silent --output /dev/null http://127.0.0.1:18091/
          curl --fail --silent --output /dev/null http://127.0.0.1:18091/admin
      - name: Limpiar solo los contenedores de esta prueba
        if: always()
        run: docker compose -p natan-ci down
