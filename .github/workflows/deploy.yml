name: Desplegar en VPS Hostinger
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-vps
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Actualizar clon del VPS y arrancar Docker Compose
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/natan_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/natan_deploy ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/natan_deploy' EXIT
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/natan_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" 'cd /opt/natan-https && test -f .deploy-private/active.json && sh deploy/update.sh'
